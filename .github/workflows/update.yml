name: Update Cloudflare IPv4 IPs

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cloudflare-ipv4-update
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout triggering branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Run IPv4 scan (TCP 443 only)
        run: python -m src.main
        env:
          PYTHONUNBUFFERED: "1"

      - name: Commit and push results (retry safely)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/ipv4 output/summary.json best-cf-ip-scanned-top*.txt cf-ipv4-top*.txt all.txt fast.txt stable.txt
          if git diff --cached --quiet; then
            echo "No result changes to commit."
            exit 0
          fi

          # Back up only generated result files before syncing with the latest main.
          git diff --cached --name-only -z > /tmp/result-files.list
          tar --null --files-from=/tmp/result-files.list -czf /tmp/ipv4-results.tar.gz
          TARGET_BRANCH="${GITHUB_REF_NAME}"

          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}/3"
            git fetch origin "${TARGET_BRANCH}"
            git reset --hard "origin/${TARGET_BRANCH}"
            tar -xzf /tmp/ipv4-results.tar.gz
            git add -A

            if git diff --cached --quiet; then
              echo "The latest remote branch already contains these results."
              exit 0
            fi

            git commit -m "chore: update Cloudflare IPv4 results"
            if git push origin "HEAD:${TARGET_BRANCH}"; then
              echo "IPv4 results pushed successfully."
              exit 0
            fi

            echo "Push rejected because the remote branch moved; retrying."
          done

          echo "Failed to push IPv4 results after 3 attempts."
          exit 1
