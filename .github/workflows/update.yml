name: Update Cloudflare IPs (IPv4 + IPv6 China verified)

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 10,22 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: cloudflare-ip-update
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout triggering branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        id: tests
        run: pytest -q

      - name: Run IPv4/IPv6 scans and China carrier verification
        id: scan
        run: python -m src.main
        env:
          PYTHONUNBUFFERED: "1"
          GLOBALPING_TOKEN: ${{ secrets.GLOBALPING_API_TOKEN }}
          CHINA_PROBE_BUDGET: "24"
          CHINA_IPV6_PROBE_BUDGET: "12"

      - name: Commit and push results (retry safely)
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The IPv6 files may not exist when HostMonit is unavailable; stage generated changes safely.
          git add -A
          if git diff --cached --quiet; then
            echo "No result changes to commit."
            exit 0
          fi

          # Back up only generated result files before syncing with the latest main.
          git diff --cached --name-only -z > /tmp/result-files.list
          tar --null --files-from=/tmp/result-files.list -czf /tmp/ipv4-results.tar.gz
          TARGET_BRANCH="${GITHUB_REF_NAME}"

          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}/3"
            git fetch origin "${TARGET_BRANCH}"
            git reset --hard "origin/${TARGET_BRANCH}"
            tar -xzf /tmp/ipv4-results.tar.gz
            git add -A

            if git diff --cached --quiet; then
              echo "The latest remote branch already contains these results."
              exit 0
            fi

            git commit -m "chore: update Cloudflare IPv4 scan and IPv6 source data"
            if git push origin "HEAD:${TARGET_BRANCH}"; then
              echo "IPv4 scan and IPv6 source data pushed successfully."
              exit 0
            fi

            echo "Push rejected because the remote branch moved; retrying."
          done

          echo "Failed to push IPv4 results after 3 attempts."
          exit 1

      - name: Keep latest 5 workflow run records
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          RUNS_JSON="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/workflows/update.yml/runs?per_page=100" | jq -s '[.[].workflow_runs[]]')"

          # Keep the five newest completed runs (successes and failures).
          # Never delete queued or in-progress runs.
          RUN_IDS="$(jq -r '[.[] | select(.status == "completed")] | sort_by(.created_at) | reverse | .[5:][] | .id' <<< "$RUNS_JSON")"

          while IFS= read -r run_id; do
            [[ -z "$run_id" ]] && continue
            echo "Deleting completed workflow run outside the latest five: $run_id"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/$run_id" || echo "Could not delete run $run_id; continuing."
          done <<< "$RUN_IDS"
