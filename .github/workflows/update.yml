name: Update Cloudflare IPv4 IPs

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cloudflare-ipv4-update
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout triggering branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Diagnose IPv6 outbound connectivity (non-blocking)
        run: |
          python - <<'PY'
          import socket
          import ssl

          print("IPv6 supported by Python:", socket.has_ipv6)

          try:
              records = socket.getaddrinfo(
                  "cloudflare.com", 443, socket.AF_INET6, socket.SOCK_STREAM
              )
              addresses = list(dict.fromkeys(item[4][0] for item in records))
              print("IPv6 DNS: PASS")
              print("Resolved IPv6 addresses:", ", ".join(addresses[:5]))
          except Exception as exc:
              addresses = []
              print(f"IPv6 DNS: FAIL ({type(exc).__name__}: {exc})")

          website_ok = False
          for address in addresses[:3]:
              raw = socket.socket(socket.AF_INET6, socket.SOCK_STREAM)
              raw.settimeout(6)
              try:
                  raw.connect((address, 443, 0, 0))
                  context = ssl.create_default_context()
                  with context.wrap_socket(raw, server_hostname="cloudflare.com") as tls:
                      tls.settimeout(6)
                      tls.sendall(
                          b"HEAD /cdn-cgi/trace HTTP/1.1\r\n"
                          b"Host: cloudflare.com\r\n"
                          b"Connection: close\r\n\r\n"
                      )
                      response = tls.recv(256).split(b"\r\n", 1)[0]
                      print(f"IPv6 TCP/TLS/HTTPS to {address}: PASS ({response.decode(errors='replace')})")
                      website_ok = True
                      break
              except Exception as exc:
                  print(f"IPv6 connection to {address}: FAIL ({type(exc).__name__}: {exc})")
              finally:
                  try:
                      raw.close()
                  except Exception:
                      pass

          resolver = socket.socket(socket.AF_INET6, socket.SOCK_STREAM)
          resolver.settimeout(6)
          try:
              resolver.connect(("2606:4700:4700::1111", 443, 0, 0))
              print("IPv6 TCP to Cloudflare public resolver (2606:4700:4700::1111:443): PASS")
          except Exception as exc:
              print(f"IPv6 TCP to Cloudflare public resolver: FAIL ({type(exc).__name__}: {exc})")
          finally:
              resolver.close()

          print("FINAL IPv6 EGRESS RESULT:", "PASS" if website_ok else "FAIL")
          print("This diagnostic is informational and does not stop the existing IPv4 scan.")
          PY

      - name: Run IPv4 scan (TCP 443 only)
        run: python -m src.main
        env:
          PYTHONUNBUFFERED: "1"

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/ipv4 output/summary.json best-cf-ip-scanned-top*.txt cf-ipv4-top*.txt all.txt fast.txt stable.txt
          if git diff --cached --quiet; then
            echo "No result changes to commit."
            exit 0
          fi
          git commit -m "chore: update Cloudflare IPv4 results"
          TARGET_BRANCH="${GITHUB_REF_NAME}"
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"
